name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # npm 11.5.1+ is required for Trusted Publishing.
      # This repo's OIDC subject is immutable (repo:LenarBad@id/apdt@id). npm
      # rejects that form (npm/cli#9969), so a NODE_AUTH_TOKEN secret publishes
      # until the exchange accepts it. An empty token must be removed or npm
      # skips OIDC and fails with ENEEDAUTH.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          npm install -g npm@11
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            sed -i '/_authToken/d' "$npmrc"
          fi
          npm publish --access public
