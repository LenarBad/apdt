name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Trusted Publishing (OIDC) for LenarBad/apdt / publish.yml.
      # npm 11.5.1+ is required. setup-node writes an empty _authToken, which
      # makes npm skip OIDC and fail with ENEEDAUTH. Remove that line.
      - name: Publish to npm
        run: |
          npm install -g npm@11
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"
          npm publish --access public
